name: Mantener activa la base de datos

# Supabase pausa los proyectos del plan gratis tras 7 días sin actividad.
# Una consulta liviana cada 3 días lo mantiene activo.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Supabase
        run: |
          set -a; . ./.env; set +a
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "$VITE_SUPABASE_URL/rest/v1/rpc/check_band_code" \
            -H "apikey: $VITE_SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Respuesta: $code"
          test "$code" = 200
